version: '3.8'
services:
  postgres_individual:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: LdKrlv
      POSTGRES_PASSWORD: 0987765
      POSTGRES_DB: payment_system_individual
    ports:
      - "5432:5432"
    volumes:
      - payment_system_individual_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U LdKrlv -d payment_system_individual" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment_network

  postgres_legal:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: LdKrlv
      POSTGRES_PASSWORD: 0987765
      POSTGRES_DB: payment_system_legal
    ports:
      - "5433:5432"
    volumes:
      - payment_system_legal_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U LdKrlv -d payment_system_legal" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment_network

  pgadmin:
    image: dpage/pgadmin4:7.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ladkirillova@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 0987765
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: 'False'
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
    ports:
      - "0.0.0.0:8081:80"
    depends_on:
      postgres_individual:
        condition: service_healthy
      postgres_legal:
        condition: service_healthy
    networks:
      - payment_network

  artemis:
    image: vromero/activemq-artemis:2.16.0
    container_name: payment_artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: simetraehcapa
      ANONYMOUS_LOGIN: "false"
    volumes:
      - artemis_data:/var/lib/artemis/data
    networks:
      - payment_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sSf http://localhost:8161/console || nc -z localhost 61616 || exit 0" ]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 60s

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: payment_zookeeper
    ports:
      - "2181:2181"
    networks:
      - payment_network
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka:latest
    container_name: payment_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "transactions:3:1"
    depends_on:
      - zookeeper
    networks:
      - payment_network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --list --zookeeper zookeeper:2181 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: payment_kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
    networks:
      - payment_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-app:
    build: ./Payment_System
    environment:
      SPRING_DATASOURCE_LEGAL_JDBC_URL: jdbc:postgresql://postgres_legal:5432/payment_system_legal
      SPRING_DATASOURCE_LEGAL_USERNAME: LdKrlv
      SPRING_DATASOURCE_LEGAL_PASSWORD: 0987765
      SPRING_DATASOURCE_INDIVIDUAL_JDBC_URL: jdbc:postgresql://postgres_individual:5432/payment_system_individual
      SPRING_DATASOURCE_INDIVIDUAL_USERNAME: LdKrlv
      SPRING_DATASOURCE_INDIVIDUAL_PASSWORD: 0987765
      SPRING_LIQUIBASE_ENABLED: "false"
      APP_LIQUIBASE_ENABLED: "true"
      APP_LIQUIBASE_LEGAL_ENABLED: "true"
      APP_LIQUIBASE_INDIVIDUAL_ENABLED: "true"
      SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616?reconnectAttempts=-1
      SPRING_ARTEMIS_USER: artemis
      SPRING_ARTEMIS_PASSWORD: simetraehcapa
      APP_INITDATA_ENABLED: "true"
        # === Kafka ===
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_MESSAGING_BACKEND: kafka
    depends_on:
      postgres_individual:
        condition: service_healthy
      postgres_legal:
        condition: service_healthy
      artemis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - payment_network
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s


  load-generator:
    build: ./load-generator
    command: sh -c "sleep 180 && java LoadGenerator"
    depends_on:
      - payment-app
    networks:
      - payment_network
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - payment_network

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    networks:
      - payment_network

  tyk-gateway:
    image: tykio/tyk-gateway:latest
    depends_on:
      - redis
      - payment-app
    environment:
      TYK_GW_LISTENPORT: "8080"
      TYK_GW_SECRET: "tyksecret"
      TYK_GW_NODESECRET: "tyknode"
      TYK_GW_STORAGE_TYPE: "redis"
      TYK_GW_STORAGE_ADDRS: "redis:6379"
      TYK_GW_APPPATH: "/opt/tyk-gateway/apps"
    volumes:
      - ./tyk/apps:/opt/tyk-gateway/apps
    ports:
      - "8085:8080"
    networks:
      - payment_network


volumes:
  payment_system_individual_data:
    driver: local
  payment_system_legal_data:
    driver: local
  artemis_data:
    driver: local
  redis-data:
    driver: local

networks:
  payment_network:
    driver: bridge
